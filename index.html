<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d1117"
    >

    <meta
        name="description"
        content="Archivio infermieristico in pillole"
    >

    <title>Nursing Shot</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>
<script src="./app.js"></script>

<script>
    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(() => {
                    console.log(
                        "Service worker registrato correttamente."
                    );
                })
                .catch(error => {
                    console.error(
                        "Errore registrazione service worker:",
                        error
                    );
                });

        });

    }
</script>

</body>
</html>

<body>

    <main>

        <header>

            <button
                id="backButton"
                class="home-button"
                type="button"
                aria-label="Torna indietro"
            >
                ←
            </button>

            <h1>
                🩺 Nursing Shot
            </h1>

        </header>


        <div id="shortcuts"></div>


        <div id="pageHeader">

            <h2 id="state"></h2>

            <p id="description"></p>

        </div>


        <div id="content"></div>

    </main>


    <script src="app.js"></script>

</body>

</html>
