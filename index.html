<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d1117"
    >

    <meta
        name="description"
        content="Archivio infermieristico in pillole"
    >

    <title>Nursing Shot</title>


    <!-- FAVICON -->

    <link
        rel="icon"
        href="./icon.svg"
        type="image/svg+xml"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./style.css"
    >


    <!-- PWA -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);

            if (
                params.has("state") ||
                params.has("item") ||
                params.has("patients") ||
                params.has("patient") ||
                params.has("editor") ||
                params.has("links")
            ) {
                document.documentElement.classList.add("app-internal-route");
            }
        })();
    </script>

</head>


<body>

    <div id="appLoadingScreen" aria-hidden="true">
        <img src="./icon.svg" alt="" class="app-loading-icon">
        <div class="app-loading-title">Nursing Shot</div>
    </div>

    <style>
        html.app-internal-route #appLoadingScreen {
            display: none;
        }

        #appLoadingScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #E1F4F5;
            color: #0d1117;
            opacity: 1;
            visibility: visible;
            transition: opacity .18s ease, visibility .18s ease;
        }

        #appLoadingScreen.app-loading-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .app-loading-icon {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
        }

        .app-loading-title {
            margin-top: -2px;
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.1;
        }
    </style>

    <div id="settingsPanel" class="settings-panel" hidden>
        <div class="settings-card">
            <div class="settings-header">
                <h2>Impostazioni</h2>
                <button id="settingsClose" class="home-button" type="button" aria-label="Chiudi impostazioni">×</button>
            </div>
            <div class="settings-group">
                <button id="orderModeButton" class="settings-action" type="button">↕️ Modifica ordine</button>
                <button id="resetOrderButton" class="settings-action" type="button">↩️ Ripristina ordini</button>
                <button id="settingsThemeButton" class="settings-action" type="button">🌙 Tema</button>
                <button id="noteLinksButton" class="settings-action" type="button">🔗 Collegamenti tra note</button>

                <div class="settings-divider"></div>

                <button id="sharePersonalizationButton" class="settings-action" type="button">📤 Condividi personalizzazione</button>

                <div class="settings-divider"></div>

                <button id="resetPersonalizationButton" class="settings-action settings-danger" type="button">↩️ Ripristino completo</button>
            </div>
            <p id="settingsMessage" class="settings-message"></p>
        </div>
    </div>

    <main>

        <header>

            <button
                id="backButton"
                class="home-button"
                type="button"
                aria-label="Torna indietro"
            >
                ←
            </button>

            <h1>
                🩺 Nursing Shot
            </h1>

            <button
                id="settingsButton"
                class="home-button settings-button"
                type="button"
                aria-label="Impostazioni"
            >
                ⚙️
            </button>

        </header>


        <div id="shortcuts"></div>


        <div id="pageHeader">

            <div class="page-title-row"><h2 id="state"></h2></div>

            <p id="description"></p>

        </div>


        <div id="content"></div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="./app.js"></script>

    <!-- SERVICE WORKER PWA -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => {
                        console.log("Service worker registrato correttamente.");
                    })
                    .catch(error => {
                        console.error("Errore registrazione service worker:", error);
                    });
            });
        }
    </script>

</body>

</html>
