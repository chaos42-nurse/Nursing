<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d1117"
    >

    <meta
        name="description"
        content="Archivio infermieristico in pillole"
    >

    <title>Nursing Shot</title>


    <!-- FAVICON -->

    <link
        rel="icon"
        href="./icon.svg"
        type="image/svg+xml"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./style.css"
    >


    <!-- PWA -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

</head>


<body>

    <main>

        <header>

            <button
                id="themeButton"
                class="home-button theme-button"
                type="button"
                aria-label="Passa alla modalità chiara"
            >
                💡
            </button>

            <button
                id="backButton"
                class="home-button"
                type="button"
                aria-label="Torna indietro"
            >
                ←
            </button>

            <h1>
                🩺 Nursing Shot
            </h1>

        </header>


        <div id="shortcuts"></div>


        <div id="pageHeader">

            <h2 id="state"></h2>

            <p id="description"></p>

        </div>


        <div id="content"></div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="./app.js"></script>

    <!-- SERVICE WORKER PWA -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => {
                        console.log("Service worker registrato correttamente.");
                    })
                    .catch(error => {
                        console.error("Errore registrazione service worker:", error);
                    });
            });
        }
    </script>

</body>

</html>
