<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d1117"
    >

    <meta
        name="description"
        content="Archivio infermieristico in pillole"
    >

    <title>Nursing Shot</title>


    <!-- FAVICON -->

    <link
        rel="icon"
        href="./icon-192.png"
        type="image/png"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./style.css"
    >


    <!-- PWA -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <style>
        /*
         * Lo splash è NASCOSTO per impostazione predefinita.
         * Viene mostrato solo quando siamo sulla home dell'app.
         * In questo modo una navigazione interna non può produrre
         * nemmeno un singolo frame della schermata d'avvio.
         */
        #appLoadingScreen {
            display: none;
        }

        html.app-show-loading #appLoadingScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #E1F4F5;
            color: #0d1117;
            opacity: 1;
            visibility: visible;
            transition: opacity .18s ease, visibility .18s ease;
        }

        html.app-show-loading #appLoadingScreen.app-loading-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .app-loading-logo {
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 10px;
        }

        .app-loading-title {
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .app-loading-description {
            margin-top: 6px;
            color: #5d6b78;
            font-size: 0.94rem;
            line-height: 1.4;
            text-align: center;
        }
    </style>

    <script>
        (() => {
            /*
             * Solo la home senza parametri deve mostrare lo splash.
             * Tutte le pagine interne partono direttamente dal contenuto.
             */
            const isHome = !window.location.search;
            const splashAlreadyShown =
                sessionStorage.getItem("nursing-splash-shown") === "1";

            if (isHome && !splashAlreadyShown) {
                sessionStorage.setItem("nursing-splash-shown", "1");
                document.documentElement.classList.add("app-show-loading");
            }
        })();
    </script>

</head>


<body>

    <div id="appLoadingScreen" aria-hidden="true">
        <div class="app-loading-logo">🩺</div>
        <div class="app-loading-title">Nursing Shot</div>
        <div class="app-loading-description">Archivio infermieristico in pillole</div>
    </div>

    <div id="settingsPanel" class="settings-panel" hidden>
        <div class="settings-card">
            <div class="settings-header">
                <h2>Impostazioni</h2>
                <button id="settingsClose" class="home-button" type="button" aria-label="Chiudi impostazioni">×</button>
            </div>
            <div class="settings-group">
                <button id="orderModeButton" class="settings-action" type="button">↕️ Modifica ordine</button>
                <button id="resetOrderButton" class="settings-action" type="button">↩️ Ripristina ordini</button>
                <button id="settingsThemeButton" class="settings-action" type="button">🌙 Tema</button>
                <button id="noteLinksButton" class="settings-action" type="button">🔗 Collegamenti tra note</button>

                <div class="settings-divider"></div>

                <button id="sharePersonalizationButton" class="settings-action" type="button">📤 Condividi personalizzazione</button>

                <div class="settings-divider"></div>

                <button id="resetPersonalizationButton" class="settings-action settings-danger" type="button">↩️ Ripristino completo</button>
            </div>
            <p id="settingsMessage" class="settings-message"></p>
        </div>
    </div>

    <main>

        <header>

            <button
                id="backButton"
                class="home-button"
                type="button"
                aria-label="Torna indietro"
            >
                ←
            </button>

            <h1>
                🩺 Nursing Shot
            </h1>

            <button
                id="settingsButton"
                class="home-button settings-button"
                type="button"
                aria-label="Impostazioni"
            >
                ⚙️
            </button>

        </header>


        <div id="shortcuts"></div>


        <div id="pageHeader">

            <div class="page-title-row"><h2 id="state"></h2></div>

            <p id="description"></p>

        </div>


        <div id="content"></div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="./app.js?v=50"></script>

    <!-- SERVICE WORKER PWA -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js?v=50")
                    .then(() => {
                        console.log("Service worker registrato correttamente.");
                    })
                    .catch(error => {
                        console.error("Errore registrazione service worker:", error);
                    });
            });
        }
    </script>

</body>

</html>
