name: Aggiornamento database interazioni

on:
  push:
    paths:
      - "data/db_drug_interactions.csv.zip"
      - "scripts/update_interactions.py"
      - ".github/workflows/update-interactions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-interactions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Estrai e converti il database TDCommons
        run: python scripts/update_interactions.py

      - name: Verifica output
        run: |
          test -s data/interazioni.csv
          python - <<'PY'
          import csv
          with open("data/interazioni.csv", encoding="utf-8", newline="") as f:
              r = csv.reader(f)
              header = next(r)
              assert header == ["farmacoA", "farmacoB", "nota"], header
              first = next(r, None)
              assert first and first[0] and first[1], "CSV senza record validi"
          print("CSV interazioni valido.")
          PY

      - name: Salva il database convertito
        run: |
          git config user.name "Nursing Shot Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interazioni.csv data/interazioni-meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna database interazioni TDCommons"
          git push
