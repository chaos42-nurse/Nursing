name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Ogni pubblicazione ha una versione nuova della cache: non serve piu' cambiarla a mano.
      - name: Imposta la versione della cache
        run: |
          node scripts/imposta-versione.mjs "$(date -u +%Y%m%d%H%M)"
          node scripts/test_versioni.mjs

      # Un errore nei dati o nel codice blocca la pubblicazione invece di arrivare agli utenti.
      - name: Controlli prima della pubblicazione
        run: |
          for f in app.js service-worker.js js/*.js app/*.js; do node --check "$f"; done
          node scripts/test_classi.mjs
          node scripts/test_terapia_paziente.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
