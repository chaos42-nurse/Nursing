name: Aggiornamento automatico dati

on:
  schedule:
    # Primo giorno di ogni mese alle 01:00 UTC
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Aggiorna dati
        run: python scripts/update_drugs.py

      - name: Verifica aggiornamento
        run: |
          if [ ! -f data/version.json ]; then
            echo "::error::Aggiornamento fallito: data/version.json non è stato creato."
            exit 1
          fi

          echo "Aggiornamento completato."
          cat data/version.json

      - name: Commit e push se ci sono modifiche
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add data/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Auto-update: aggiornamento dati"
            git push
          fi
