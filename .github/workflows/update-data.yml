name: Aggiornamento Mensile Database AIFA

on:
  schedule:
    # Esegue lo script alle 00:00 del primo giorno di ogni mese
    - cron: '0 0 1 * *'
  workflow_dispatch: # Ti permette di avviare l'aggiornamento anche a mano da GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-js-version: '18'

      - name: Scarica e converti il file AIFA
        run: |
          # Sostituisci questo URL con il link effettivo del file CSV/Excel di AIFA
          curl -o src/data/farmaci_nuovi.csv "https://www.aifa.gov.it/documents/20142/825643/Lista_farmaci_equivalenti.csv"
          
          # Opzionale: Se usi uno script Node/Python per ripulire i dati o convertirli in JSON
          # node scripts/parse-aifa.js

      - name: Salva le modifiche nel repository
        run: |
          git config --global user.name "AIFA Update Bot"
          git config --global user.email "bot@github.com"
          git add src/data/
          git commit -m "Auto-aggiornamento database farmaci AIFA (Mensile)" || exit 0
          git push
