name: Aggiornamento Mensile Database AIFA

on:
  schedule:
    # Esegue lo script alle 00:00 del primo giorno di ogni mese
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-js-version: '18'

      - name: Scarica e organizza il file AIFA
        run: |
          mkdir -p src/data
          curl -L -o src/data/farmaci.csv "https://www.aifa.gov.it/documents/20142/825643/Lista_farmaci_equivalenti.csv"
          
          # Genera un file di testo con la data di oggi (formato GG/MM/AAAA)
          date +"%d/%m/%Y" > src/data/ultimo-aggiornamento.txt

      - name: Salva le modifiche nel repository
        run: |
          git config --global user.name "AIFA Update Bot"
          git config --global user.email "bot@github.com"
          git add src/data/
          git commit -m "Auto-aggiornamento database farmaci AIFA (Mensile)" || exit 0
          git push
