name: Aggiornamento mensile principi attivi AIFA

# Il 16 di ogni mese controlla il CSV dell'AIFA (https://www.aifa.gov.it/liste-dei-farmaci).
# Se ci sono nuovi principi attivi, sostituisce src/data/farmaci.csv con il file scaricato,
# aggiorna l'indice delle classi farmacologiche e ripubblica l'app.
on:
  schedule:
    - cron: '0 6 16 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scarica il CSV AIFA e cerca nuovi principi attivi
        id: aifa
        run: python3 scripts/update_principi_attivi.py

      - name: Smista le nuove voci nelle classi farmacologiche (per codice ATC)
        if: steps.aifa.outputs.changed == 'true'
        run: node src/data/smista-farmaci.js

      - name: Controlla la coerenza dei dati prima di salvarli
        if: steps.aifa.outputs.changed == 'true'
        run: node scripts/test_classi.mjs

      - name: Salva le modifiche nel repository e ripubblica l'app
        if: steps.aifa.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "AIFA Update Bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data data/version.json
          git commit -m "Aggiornamento mensile AIFA: $(cat "$RUNNER_TEMP/aggiornamento-aifa.txt")" || exit 0
          git push
          # I push fatti con il token del workflow non avviano altri workflow: la pubblicazione si lancia a mano.
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
