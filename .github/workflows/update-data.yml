name: Aggiornamento Mensile Database AIFA

on:
  schedule:
    # Esegue lo script alle 00:00 del primo giorno di ogni mese
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Scarica e organizza il file AIFA
        run: |
          set -euo pipefail

          mkdir -p src/data data

          TMP_CSV="src/data/farmaci.csv.tmp"
          TMP_INDEX="src/data/aifa-principi-attivi.json.tmp"

          # Il download avviene prima su un file temporaneo:
          # se il file non è valido, i dati già presenti non vengono toccati.
          curl -fL --retry 3 -o "$TMP_CSV" "https://www.aifa.gov.it/documents/20142/825643/Lista_farmaci_equivalenti.csv"

          python - <<'PY'
          import csv
          import json
          import os
          import re

          csv_path = "src/data/farmaci.csv.tmp"
          index_path = "src/data/aifa-principi-attivi.json.tmp"

          # AIFA può pubblicare il CSV con una codifica Windows-1252.
          # Prova prima UTF-8 e, solo se necessario, usa CP1252.
          try:
              with open(csv_path, "r", encoding="utf-8-sig", newline="") as test:
                  test.read(8192)
              csv_encoding = "utf-8-sig"
          except UnicodeDecodeError:
              csv_encoding = "cp1252"

          with open(csv_path, "r", encoding=csv_encoding, newline="") as f:
              sample = f.read(8192)
              f.seek(0)

              try:
                  dialect = csv.Sniffer().sniff(sample, delimiters=",;\t")
              except csv.Error:
                  dialect = csv.excel

              reader = csv.DictReader(f, dialect=dialect)

              if not reader.fieldnames:
                  raise RuntimeError("File AIFA non valido: intestazione assente.")

              fields = [field.strip() for field in reader.fieldnames if field]
              if "Principio attivo" not in fields:
                  raise RuntimeError(
                      "File AIFA non valido: colonna 'Principio attivo' assente. "
                      "Nessun dato esistente è stato modificato."
                  )

              active_ingredients = set()

              for row in reader:
                  value = (row.get("Principio attivo") or "").strip()
                  if not value:
                      continue

                  # L'indice contiene i singoli principi attivi.
                  # Le associazioni A + B vengono quindi rese ricercabili
                  # anche per ciascun componente.
                  for part in re.split(r"\s*\+\s*", value):
                      part = part.strip()
                      if part:
                          active_ingredients.add(part)

          index = sorted(
              active_ingredients,
              key=lambda value: value.casefold()
          )

          with open(index_path, "w", encoding="utf-8") as f:
              json.dump(index, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Indice AIFA creato: {len(index)} principi attivi unici.")
          PY

          # Sostituzione atomica solo dopo che CSV e indice hanno superato i controlli.
          mv "$TMP_CSV" src/data/farmaci.csv
          mv "$TMP_INDEX" src/data/aifa-principi-attivi.json

          # Genera un file di testo con la data di oggi
          date +"%d/%m/%Y" > src/data/ultimo-aggiornamento.txt

          # Metadata letto dalla PWA per mostrare la data dell'ultimo aggiornamento.
          python - <<'PY'
          import json
          from datetime import date

          today = date.today().isoformat()
          version = int(today.replace("-", ""))

          with open("data/version.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "version": version,
                      "last_updated": today,
                      "source": "AIFA",
                      "file": "src/data/farmaci.csv"
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

          echo "Aggiornamento AIFA completato."
          echo "Indice: src/data/aifa-principi-attivi.json"

      - name: Salva le modifiche nel repository
        run: |
          git config --global user.name "AIFA Update Bot"
          git config --global user.email "bot@github.com"
          git add src/data/ data/version.json
          git commit -m "Auto-aggiornamento database farmaci AIFA (Mensile)" || exit 0
          git push
