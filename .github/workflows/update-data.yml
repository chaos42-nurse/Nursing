name: Aggiornamento Automatico Principi Attivi AIFA

on:
  schedule:
    # Esegue il primo giorno di ogni mese alle 02:00 UTC
    - cron: '0 2 1 * *'
  # Permette anche di avviarlo manualmente dalla sezione Actions
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Esegui script di aggiornamento farmaci
        run: python scripts/update_drugs.py

      - name: Salva e fai il Commit delle modifiche
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: aggiornato database farmaci e versione [skip ci]" && git push)
