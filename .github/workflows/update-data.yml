name: Aggiornamento automatico dati farmaci

on:
  schedule:
    # Primo giorno di ogni mese alle 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Aggiorna dati AIFA
        run: python scripts/update_drugs.py

      - name: Commit e push se ci sono modifiche
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add data/ scripts/update_drugs.py

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Auto-update: dati farmaci AIFA"
            git push
          fi
