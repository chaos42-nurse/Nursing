name: Aggiornamento Mensile Database AIFA

on:
  schedule:
    - cron: '0 0 1 * *' # Parte da solo il 1° giorno di ogni mese alle 00:00
  workflow_dispatch: # Ti permette di avviarlo a mano quando vuoi

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Scarica e organizza i file AIFA
        run: |
          # Crea la cartella dei dati se non esiste
          mkdir -p src/data
          
          # Scarica il file CSV ufficiale salvandolo temporaneamente
          curl -L -o src/data/farmaci_grezzi.csv "https://aifa.gov.it"
          
          # Lancia lo script per convertire in JSON e inserire le classi corrette
          node smista-farmaci.js
          
          # Elimina il file CSV grezzo per non appesantire il repository
          rm src/data/farmaci_grezzi.csv
          
          # Crea il file per aggiornare la data nella PWA
          date +"%d/%m/%Y" > src/data/ultimo-aggiornamento.txt

      - name: Salva le modifiche nel repository
        run: |
          git config --global user.name "AIFA Update Bot"
          git config --global user.email "bot@github.com"
          git add src/data/
          git commit -m "Auto-aggiornamento mensile e smistamento classi farmaci JSON" || exit 0
          git push
